name: Newsroom wire alert

# Tell somebody when one of the newsroom's feeds goes dead.
#
# WHY THIS IS SEPARATE FROM source-alert.yml
# ------------------------------------------
# Different subject, different failure, different fix. `source-alert.yml`
# watches the twelve dashboard sources and would page you about a frozen
# statistical series; this watches the feeds the newsroom collector fetches and
# pages you about a publisher that has stopped answering. They get their own
# labels so a stuck feed and a stuck statistic are two issues rather than one
# confusing one.
#
# They share the *delivery*, which lives in `alert-notify.yml` and is called by
# both. Copying that plumbing would be the second-implementation failure this
# repository keeps writing post-mortems about.
#
# WHY THIS IS NEEDED AT ALL, WHICH IS THE SUBTLE PART
# ---------------------------------------------------
# The collector fails **soft** on a dead feed, and that is correct: one
# publisher going down must not take an edition with it. The consequence is
# that the pipeline keeps running, keeps publishing, and says nothing. Two
# feeds were dead for weeks behind exactly that behaviour and were found by
# reading Application Insights traces by hand.
#
# So this is the only thing that will ever make a dead feed visible, which
# means a wire probe that itself fails soft is worthless. The script exits
# non-zero on a problem and this job fails; nothing here is `|| true`.

on:
  schedule:
    # Daily at 06:42 UTC — 08:42 or 09:42 in Riga, before the working day, and
    # deliberately 25 minutes after source-alert.yml so two red ticks arriving
    # together are distinguishable rather than a single wall of notification.
    - cron: '42 6 * * *'
  workflow_dispatch:
    inputs:
      rehearse:
        description: >-
          Exercise the alert path against a deliberately broken reading, to prove
          notification still works. Opens a real issue and sends a real message.
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'dead-feed'
          - 'blocked-vantage'
          - 'total-refusal'
          - 'empty-wire'
          - 'drought'
          - 'recovered'
  # Run when this monitor's own moving parts change, so a break is found by the
  # commit that caused it rather than at the next scheduled run. `sources.yaml`
  # is included because adding a feed is the most likely way to add a dead one.
  push:
    branches: [master]
    paths:
      - '.github/workflows/wire-alert.yml'
      - '.github/workflows/alert-notify.yml'
      - 'scripts/wire_check.py'
      - 'newsroom/sources.yaml'

concurrency:
  group: wire-alert
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Probe the wire
    runs-on: ubuntu-latest

    outputs:
      alert: ${{ steps.judge.outputs.alert }}
      headline: ${{ steps.judge.outputs.headline }}
      message: ${{ steps.judge.outputs.message }}
      label: ${{ steps.judge.outputs.label }}
      subject: ${{ steps.judge.outputs.subject }}
      rehearsal: ${{ steps.judge.outputs.rehearsal }}
      # ok | unresolved | alert. Published so the reading is legible from the
      # run's own outputs on a green run, where there is no issue to read it in.
      severity: ${{ steps.judge.outputs.severity }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the newsroom's declared dependencies
        # `newsroom/requirements.txt` and not a hand-picked subset, which is
        # what the first version of this step did and what broke it.
        #
        # The instinct was reasonable and wrong: install only PyYAML, so the
        # monitor does not fail whenever an unrelated newsroom dependency
        # breaks. But this probe *imports newsroom code*, and importing
        # `newsroom.pipeline.collect.rss` executes the package's `__init__`,
        # which imports `httpclient`, which imports httpx. Measured on the
        # runner: `ModuleNotFoundError: No module named 'httpx'`. It passed
        # locally only because httpx was already installed here — and the
        # comment claiming "PyYAML and nothing else" was a claim about
        # behaviour that had never been executed in a clean environment.
        #
        # `requirements.txt` documents this exact trap in its own header, and
        # names a second reason a subset is dangerous: `rss.py` falls back to
        # the standard library's XML parser when `defusedxml` is missing, so an
        # incomplete install would have this probe parsing untrusted
        # third-party feed XML with the parser that does not refuse entity
        # expansion. A missing dependency would degrade safety quietly.
        run: python -m pip install --quiet -r newsroom/requirements.txt

      - name: Build the rehearsal reading
        id: rehearsal
        if: inputs.rehearse != 'no' && inputs.rehearse != ''
        run: |
          set -euo pipefail

          # Rehearsals drive the real notification path with a broken reading
          # rather than a mock of it. A notification path that has never
          # delivered is not a notification path.
          case "${{ inputs.rehearse }}" in
            dead-feed)
              cat > rehearsal.json <<'JSON'
          {
            "results": [
              {
                "id": "ep_news", "name": "European Parliament news", "tier": "B",
                "endpoint": "https://www.europarl.europa.eu/rss/doc/top-stories/en.xml",
                "http_status": 202, "bytes": 0, "items": 0, "latency_ms": 180,
                "verified": "2026-08-24 - HTTP 200", "verified_age_days": 4,
                "state": "empty_body", "vantage_specific": false,
                "detail": "answered HTTP 202 with a zero-byte body, which every check written against response.ok reads as success"
              },
              {
                "id": "lsm_en", "name": "LSM.lv English", "tier": "C",
                "endpoint": "https://eng.lsm.lv/rss",
                "http_status": 200, "bytes": 37440, "items": 50, "latency_ms": 485,
                "verified": "2026-08-24 - HTTP 200", "verified_age_days": 4,
                "state": "ok", "detail": null
              }
            ]
          }
          JSON
              echo "args=--fixture rehearsal.json" >> "$GITHUB_OUTPUT"
              ;;
            blocked-vantage)
              # The 2026-09-01 case, which the dead-feed rehearsal cannot reach:
              # a source that refuses THIS runner while answering everyone else.
              # It produces the identical `FAIL ... HTTP 403` line as a genuinely
              # dead publisher, and must produce a different message -- one that
              # does not tell the reader to write a 403 into a `verified:` note
              # about a publisher that is up.
              #
              # SINCE #349 THIS REHEARSES THE QUIET PATH, WHICH IS THE POINT.
              # It is severity `unresolved`: the run stays green, no Telegram is
              # sent, the reading is annotated and summarised, and the routing
              # goes to `wire-vantage` so the recovery step cannot close a live
              # `wire-alert` issue as "Recovered." A rehearsal of a state that
              # deliberately does not ring is still worth having -- it is how you
              # find out the state is reachable at all, and that it is legible
              # once reached. `total-refusal` below rehearses the loud escalation.
              #
              # It rehearses the excerpt too. The body is the artefact the probe
              # used to measure and discard, which is why nobody could settle the
              # question from the run log.
              cat > rehearsal.json <<'JSON'
          {
            "results": [
              {
                "id": "err_en", "name": "ERR News (English)", "tier": "C",
                "endpoint": "https://news.err.ee/rss",
                "http_status": 403, "bytes": 1070, "items": 0, "latency_ms": 417,
                "verified": "2026-08-28 - HTTP 200, 50 items parsed by scripts/wire_check.py",
                "verified_age_days": 4,
                "state": "http_error", "vantage_specific": true,
                "body_excerpt": "Access denied - error code 1020 (a rehearsal body, not a real reading)",
                "detail": "answered HTTP 403"
              },
              {
                "id": "lsm_en", "name": "LSM.lv English", "tier": "C",
                "endpoint": "https://eng.lsm.lv/rss",
                "http_status": 200, "bytes": 37440, "items": 50, "latency_ms": 485,
                "verified": "2026-08-24 - HTTP 200", "verified_age_days": 4,
                "state": "ok", "detail": null
              }
            ]
          }
          JSON
              echo "args=--fixture rehearsal.json" >> "$GITHUB_OUTPUT"
              ;;
            total-refusal)
              # The escalation that keeps `unresolved` from being a way to go
              # quiet, exercised rather than asserted. Every source refuses, so
              # nothing delivered, so this probe has learned nothing about the
              # wire at all -- and a probe that has learned nothing must not
              # report health. It rings, and it is the same 403 as the fixture
              # above, so the two differ only in whether anything got through.
              cat > rehearsal.json <<'JSON'
          {
            "results": [
              {
                "id": "err_en", "name": "ERR News (English)", "tier": "C",
                "endpoint": "https://news.err.ee/rss",
                "http_status": 403, "bytes": 1070, "items": 0, "latency_ms": 417,
                "verified": "2026-08-28 - HTTP 200, 50 items parsed by scripts/wire_check.py",
                "verified_age_days": 4,
                "state": "http_error", "vantage_specific": true,
                "body_excerpt": "Access denied - error code 1020 (a rehearsal body, not a real reading)",
                "detail": "answered HTTP 403"
              },
              {
                "id": "lsm_en", "name": "LSM.lv English", "tier": "C",
                "endpoint": "https://eng.lsm.lv/rss",
                "http_status": 403, "bytes": 1070, "items": 0, "latency_ms": 402,
                "verified": "2026-08-24 - HTTP 200", "verified_age_days": 4,
                "state": "http_error", "vantage_specific": true,
                "body_excerpt": "Access denied - error code 1020 (a rehearsal body, not a real reading)",
                "detail": "answered HTTP 403"
              }
            ]
          }
          JSON
              echo "args=--fixture rehearsal.json" >> "$GITHUB_OUTPUT"
              ;;
            empty-wire)
              printf '{"results": []}\n' > rehearsal.json
              echo "args=--fixture rehearsal.json" >> "$GITHUB_OUTPUT"
              ;;
            drought)
              # Every feed healthy, no original journalism. The case no other
              # monitor on this site can see.
              cat > rehearsal.json <<'JSON'
          {
            "results": [
              {
                "id": "lsm_en", "name": "LSM.lv English", "tier": "C",
                "endpoint": "https://eng.lsm.lv/rss",
                "http_status": 200, "bytes": 37440, "items": 50, "latency_ms": 485,
                "verified": "2026-08-28 - HTTP 200", "verified_age_days": 0,
                "state": "ok", "detail": null
              }
            ],
            "drought": {
              "state": "drought",
              "detail": "no original article has been published for 96.0 hours (budget 72h, which is three scheduled runs). The wire may still be full of syndicated cards, and every other check stays green through this",
              "last_original_at": "2026-08-24T12:00:00Z",
              "hours": 96.0,
              "runs_without_originals": 0
            }
          }
          JSON
              echo "args=--fixture rehearsal.json" >> "$GITHUB_OUTPUT"
              ;;
            recovered)
              # THE STAND-DOWN, WHICH IS THE ONLY LEG NO REHEARSAL COULD REACH.
              #
              # Every other option here is a fault, so every one produces an
              # alert. Measured against the five that existed before this:
              #
              #   dead-feed        alert=true   -> opens wire-alert-rehearsal
              #   total-refusal    alert=true   -> opens wire-alert-rehearsal
              #   empty-wire       alert=true   -> opens wire-alert-rehearsal
              #   drought          alert=true   -> opens wire-alert-rehearsal
              #   blocked-vantage  alert=false  -> wire-VANTAGE-rehearsal
              #
              # So four options open a `wire-alert-rehearsal` issue and nothing
              # could ever close one. `blocked-vantage` is the near miss: it is
              # clean, but #356 correctly routes an unresolved reading to its own
              # label, so it looks for an issue that is not there. A rehearsal
              # issue therefore accumulated for ever, while carrying the body
              # text "closes itself when a later run reads clean".
              #
              # It is worse since #362 added the recovery notification: that step
              # has never delivered, and a notification path that has never
              # delivered is not a notification path -- the argument this file
              # already makes about the alerting side.
              #
              # Run it after any of the alerting options above, and the pair
              # rehearses the whole lifecycle: open, notify, stand down, close.
              cat > rehearsal.json <<'JSON'
          {
            "results": [
              {
                "id": "lsm_en", "name": "LSM.lv English", "tier": "C",
                "endpoint": "https://eng.lsm.lv/rss",
                "http_status": 200, "bytes": 37440, "items": 50, "latency_ms": 485,
                "verified": "2026-08-28 - HTTP 200", "verified_age_days": 0,
                "state": "ok", "detail": null
              }
            ],
            "drought": {
              "state": "ok",
              "detail": null,
              "last_original_at": "2026-09-01T14:08:22Z",
              "hours": 2.0,
              "runs_without_originals": 0
            }
          }
          JSON
              echo "args=--fixture rehearsal.json" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Probe every feed the collector fetches
        id: judge
        env:
          EXTRA_ARGS: ${{ steps.rehearsal.outputs.args }}
        run: |
          # `set +e` is load-bearing and must not be tidied away. GitHub runs
          # every `run:` block as `bash -e`, so without it the script's non-zero
          # exit -- the alert itself -- would abort the job before the report is
          # handed to the notifier. The monitor would go red and silent at
          # exactly the moment it has something to say.
          set +e
          set -u

          # Establish the absence rather than assume it.
          #
          # The guard below reads `[ ! -f report.json ]` and *means* "the probe
          # failed to write a report". Those are only the same thing if no
          # report.json can arrive by any other route — and one did: a scratch
          # file swept into a commit by `git add -A`, which the checkout then
          # restored. The probe crashed on a missing module, the guard saw a
          # file and stayed quiet, and the step read a **previous run of a
          # different monitor**, reporting "the status endpoint could not be
          # reached" from a wire probe. Real, well-formed, and about something
          # else entirely.
          rm -f report.json

          # shellcheck disable=SC2086
          python scripts/wire_check.py --json report.json ${EXTRA_ARGS:-} 2>&1 | tee console.txt
          code=${PIPESTATUS[0]}
          echo "Probe exited ${code}"

          # A missing report means the probe died before writing one. That is a
          # broken monitor, and a broken monitor must shout rather than pass.
          if [ ! -f report.json ]; then
            python - "$code" <<'PY'
          import json, sys
          code = sys.argv[1]
          json.dump({
              "alert": True,
              "headline": "the wire probe itself failed to produce a report",
              "text": (
                  "portaBaltica newsroom wire: ALERT - scripts/wire_check.py exited "
                  + code + " without writing report.json. The monitor is broken, so the "
                  "feeds were NOT checked. See the workflow log."
              ),
          }, open("report.json", "w"), indent=2)
          PY
            code=1
          fi

          # Anything other than a clean 0 is an alert, usage errors included: a
          # monitor invoked wrongly has checked nothing, and treating that as
          # health is the failure this whole file is built against.
          #
          # The report is read BEFORE that decision is taken, because the
          # decision now consults it -- see the `alert` line below.
          python - <<'PY'
          import json
          r = json.load(open("report.json"))
          open("headline.txt", "w", encoding="utf-8").write(
              r.get("headline") or "the wire could not be summarised")
          open("message.txt", "w", encoding="utf-8").write(
              r.get("text") or "portaBaltica newsroom wire: ALERT - the report carried no text.")

          # Where to deliver it. A rehearsal must not write into the production
          # incident record, so the probe says which issue this belongs in --
          # derived from what it actually judged, not from the `rehearse` input.
          #
          # ABSENCE RESOLVES TO THE LIVE ISSUE, and that direction is chosen
          # rather than inherited. This branch also runs for the synthesised
          # report written when the probe died without producing one, which
          # carries no routing at all. A dead monitor during a real outage must
          # reach the real issue; the cost of being wrong the other way is a
          # rehearsal touching the live issue, which is exactly today's
          # behaviour and so not a regression.
          routing = r.get("routing") or {}
          open("label.txt", "w", encoding="utf-8").write(
              routing.get("label") or "wire-alert")
          open("subject.txt", "w", encoding="utf-8").write(
              routing.get("subject") or "Newsroom wire")
          # Whether this reading came from a fixture. The notifier says so in the
          # message's FIRST line, because that is what a phone preview shows and
          # a rehearsal must still ring. Absence resolves to "not a rehearsal",
          # which is the direction that never suppresses a real alarm.
          open("rehearsal.txt", "w", encoding="utf-8").write(
              routing.get("rehearsal") or "false")

          # ok | unresolved | alert. A reading the probe has declared
          # inconclusive about the publisher is reported here and does not ring;
          # see scripts/wire_check.py for the measurement that forced that.
          #
          # ABSENCE RESOLVES TO ALERTING. A report with no severity -- the
          # synthesised one written when the probe died, or one from an older
          # revision of the script -- reads as `alert`, so the one state that
          # suppresses a notification is reachable only by being named.
          open("severity.txt", "w", encoding="utf-8").write(
              routing.get("severity") or "alert")
          PY

          severity=$(cat severity.txt)
          echo "Probe severity ${severity}"

          # Ring when the probe exited non-zero OR when the report says alert.
          # Two independent sources, and either one is enough, because they fail
          # in opposite directions: the exit code catches a crash that never
          # reached a verdict, and the severity catches a verdict that somehow
          # failed to reach the exit code. Silence needs both to agree.
          if [ "$code" -eq 0 ] && [ "$severity" != "alert" ]; then
            echo "alert=false" >> "$GITHUB_OUTPUT"
          else
            echo "alert=true" >> "$GITHUB_OUTPUT"
          fi

          # An unresolved reading is reported rather than rung, so it needs
          # somewhere to be seen on a green run. An annotation shows on the run
          # page and in the Actions list without failing anything, and the full
          # report reaches the job summary either way via the notifier.
          if [ "$severity" = "unresolved" ]; then
            echo "::warning::$(cat headline.txt)"
            {
              echo "### Newsroom wire: unresolved"
              echo
              echo "This run did not fail. A source declined this vantage and the"
              echo "publisher state is unknown; the wire is otherwise delivering."
              echo
              echo '```'
              cat message.txt
              echo ""
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # The delimiter form is required: the report is multi-line, and a bare
          # `key=value` would silently keep only its first line.
          {
            echo "headline<<__EOF__"
            cat headline.txt
            echo ""
            echo "__EOF__"
            echo "message<<__EOF__"
            cat message.txt
            echo ""
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

          # Single-line, so the plain form is correct and the delimiter form
          # would only add a way to get it wrong.
          echo "label=$(cat label.txt)" >> "$GITHUB_OUTPUT"
          echo "subject=$(cat subject.txt)" >> "$GITHUB_OUTPUT"
          echo "rehearsal=$(cat rehearsal.txt)" >> "$GITHUB_OUTPUT"
          echo "severity=${severity}" >> "$GITHUB_OUTPUT"

  # Same reasoning as source-alert.yml: `if: always()` plus the
  # `result != 'success'` test means a check job that dies outright still
  # notifies, instead of skipping this job and leaving a red, silent run.
  notify:
    name: Notify
    needs: check
    if: always()
    uses: ./.github/workflows/alert-notify.yml
    with:
      alert: ${{ (needs.check.result != 'success' || needs.check.outputs.alert == 'true') && 'true' || 'false' }}
      headline: ${{ needs.check.outputs.headline }}
      message: ${{ needs.check.outputs.message }}
      # The probe decides which issue this belongs in, so a rehearsal cannot
      # retitle a live outage or manufacture one on a healthy wire. The `||`
      # covers the check job dying outright, where there is no output at all:
      # absence resolves to the LIVE issue, because a dead monitor during a real
      # outage must reach the real one.
      label: ${{ needs.check.outputs.label || 'wire-alert' }}
      subject: ${{ needs.check.outputs.subject || 'Newsroom wire' }}
      # Absence resolves to 'false' — a real alarm that lost its flag must not be
      # dressed as a rehearsal, which is the one direction that could get a live
      # outage ignored.
      rehearsal: ${{ needs.check.outputs.rehearsal || 'false' }}
    secrets: inherit
