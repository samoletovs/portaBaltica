name: Data source alert

# Tell somebody when a data source freezes, instead of waiting for a reader to
# notice.
#
# WHY THIS EXISTS
# ---------------
# `/api/system-status` already does the detection, and does it well: twelve
# probes, each declaring its own cadence and lag budget, judged by
# `api/shared/freshness.js` so that a source which is *up and frozen* is
# distinguishable from one that is down. That machinery is the hard part and
# this workflow does not duplicate any of it.
#
# What the endpoint cannot do is push. It is pull-only, so a frozen feed is
# announced to whoever happens to open the dashboard. The project's own history
# says how that ends: a Eurostat series sat at 2025-12 for eight months behind
# HTTP 200, and data.gov.lv served eighteen consecutive header-only CSVs behind
# `datastore_active: true`. Both were detectable the entire time. Detection
# without notification is how they lasted that long.
#
# WHY NOT A SECOND DELIVERY CHANNEL
# ---------------------------------
# There is already a working one. `newsroom/pipeline/editor.py` ships a
# `TelegramEscalationNotifier`, `newsroom/pipeline/config.py` reads
# `NEWSROOM_TELEGRAM_BOT_TOKEN` / `NAURO_BOT_TOKEN`, and `telegram-check.yml`
# is a live end-to-end proof that the token works and the bot can reach the ops
# chat. This uses the same two secrets and the same plain-text send. A second
# channel would be a second thing to keep alive, and the lab has already shipped
# a green PR that re-pointed a notification at a revoked token and delivered
# nothing for months.
#
# THE DESIGN RULE, WHICH IS THE WHOLE POINT
# -----------------------------------------
# **Absence resolves to an alert.** A failed fetch, a malformed body, an empty
# `checks` array, a missing report file, a crashed script — every one of them is
# an alert here, never a pass. That is why this file never uses
# `continue-on-error` with a later `success()`: that combination is precisely
# the "absence resolves to success" shape `AGENTS.md` catalogues, and it would
# send the all-clear on a job that failed. Exit codes are captured explicitly
# instead, and *anything* non-zero is treated as an alert.

on:
  schedule:
    # Daily at 06:17 UTC, which is 08:17 or 09:17 in Riga — early enough that a
    # frozen feed is known before the working day, and off the busy cron minute.
    # Every source here publishes daily at best, so a tighter loop would cost
    # runner minutes to re-read the same observation.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      rehearse:
        description: >-
          Exercise the alert path against a deliberately broken payload, to prove
          notification still works. Opens a real issue and sends a real message.
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'stale-required'
          - 'empty-checks'
          - 'unreachable'
  # Run when this monitor's own moving parts change, so a break is found by the
  # commit that caused it rather than at the next scheduled run. A monitor that
  # is only ever exercised on a schedule is one whose breakage is discovered by
  # the outage it failed to report.
  push:
    branches: [master]
    paths:
      - '.github/workflows/source-alert.yml'
      - 'scripts/source-alert.mjs'

concurrency:
  group: source-alert
  cancel-in-progress: false

permissions:
  contents: read
  # To open, update, comment on and close the alert issue. No other write scope
  # is needed: this workflow touches nothing in the repository.
  issues: write

env:
  STATUS_URL: https://portabaltica.naurolabs.com/api/system-status

jobs:
  check:
    name: Check data sources
    runs-on: ubuntu-latest

    outputs:
      alert: ${{ steps.judge.outputs.alert }}
      headline: ${{ steps.judge.outputs.headline }}
      message: ${{ steps.judge.outputs.message }}
      label: ${{ steps.judge.outputs.label }}
      subject: ${{ steps.judge.outputs.subject }}
      rehearsal: ${{ steps.judge.outputs.rehearsal }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the rehearsal payload
        id: rehearsal
        if: inputs.rehearse != 'no' && inputs.rehearse != ''
        run: |
          set -euo pipefail

          # Rehearsals run the real notification path against a broken payload,
          # rather than a mock of it. A notification path that has never
          # delivered is not a notification path.
          case "${{ inputs.rehearse }}" in
            stale-required)
              cat > rehearsal.json <<'JSON'
          {
            "status": "stale",
            "version": "rehearsal",
            "dataSources": {
              "healthy": 1, "stale": 1, "total": 2,
              "requiredHealthy": 0, "requiredTotal": 1,
              "optionalHealthy": 1, "optionalTotal": 1,
              "checks": [
                {
                  "name": "Eurostat", "status": "stale", "freshness": "stale",
                  "latency": 118, "required": true,
                  "powers": "All Baltic comparison charts",
                  "dataPeriod": "2025-12", "ageInCadenceUnits": 8.2,
                  "maxLag": 3, "cadence": "M"
                },
                {
                  "name": "Open-Meteo Weather", "status": "healthy",
                  "freshness": "fresh", "latency": 90, "required": false,
                  "powers": "Environment tile", "dataPeriod": "2026-08-28",
                  "ageInCadenceUnits": 0.2, "maxLag": 3, "cadence": "H"
                }
              ]
            },
            "fetchedAt": "2026-08-28T06:17:00.000Z"
          }
          JSON
              echo "args=--fixture rehearsal.json" >> "$GITHUB_OUTPUT"
              ;;
            empty-checks)
              cat > rehearsal.json <<'JSON'
          {
            "status": "healthy",
            "dataSources": {
              "healthy": 0, "stale": 0, "total": 0,
              "requiredHealthy": 0, "requiredTotal": 0,
              "optionalHealthy": 0, "optionalTotal": 0,
              "checks": []
            },
            "fetchedAt": "2026-08-28T06:17:00.000Z"
          }
          JSON
              echo "args=--fixture rehearsal.json" >> "$GITHUB_OUTPUT"
              ;;
            unreachable)
              # 203.0.113.0/24 is TEST-NET-3, reserved for documentation and
              # guaranteed not to route. A short timeout keeps the job brief.
              echo "args=--url http://203.0.113.1/api/system-status --timeout 3000" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Read and judge the status endpoint
        id: judge
        env:
          EXTRA_ARGS: ${{ steps.rehearsal.outputs.args }}
        run: |
          # `set +e` is load-bearing and must not be tidied away. GitHub runs
          # every `run:` block as `bash -e` by default, so without this the
          # script's non-zero exit -- the alert itself -- would abort the job
          # before a single notification step ran. The monitor would go red and
          # silent at exactly the moment it has something to say.
          set +e
          set -u

          # Establish the absence rather than assume it. The guard below reads
          # `[ ! -f report.json ]` and *means* "the script failed to write a
          # report" — which is only the same thing if no report.json can arrive
          # by another route. One did, in the sibling wire monitor: a scratch
          # file committed by accident, restored by the checkout, and read as
          # though this run had produced it.
          rm -f report.json

          # shellcheck disable=SC2086
          node scripts/source-alert.mjs --json report.json ${EXTRA_ARGS:-} 2>&1 | tee console.txt
          code=${PIPESTATUS[0]}
          echo "Script exited ${code}"

          # A missing report means the script died before it could write one --
          # a syntax error, an OOM, a runtime the runner does not have. That is
          # a broken monitor, and a broken monitor must shout rather than pass.
          if [ ! -f report.json ]; then
            node -e '
              const code = process.argv[1];
              require("fs").writeFileSync("report.json", JSON.stringify({
                alert: true,
                headline: "the monitor itself failed to produce a report",
                text: "portaBaltica data sources: ALERT - scripts/source-alert.mjs exited "
                  + code + " without writing report.json. The monitor is broken, so the "
                  + "sources were NOT checked. See the workflow log.",
              }, null, 2));
            ' "$code"
            code=1
          fi

          # Anything other than a clean 0 is an alert. Usage errors (2) included:
          # a monitor invoked wrongly has not checked anything, and treating that
          # as health is the exact failure this whole file is built against.
          if [ "$code" -eq 0 ]; then
            echo "alert=false" >> "$GITHUB_OUTPUT"
          else
            echo "alert=true" >> "$GITHUB_OUTPUT"
          fi

          # Read with node rather than jq: node is already a hard dependency of
          # this step, so it is one fewer tool that has to be present. Both
          # reads are defaulted so a shape change cannot make them fail and take
          # the notification job down with them.
          node -e '
            const r = JSON.parse(require("fs").readFileSync("report.json", "utf8"));
            const fs = require("fs");
            fs.writeFileSync("headline.txt", r.headline || "status could not be summarised");
            fs.writeFileSync("message.txt",
              r.text || "portaBaltica data sources: ALERT - the report carried no text.");

            // Where to deliver it. A rehearsal must not write into the
            // production incident record, so the probe says which issue this
            // belongs in -- derived from what it actually judged, not from the
            // `rehearse` input.
            //
            // ABSENCE RESOLVES TO THE LIVE ISSUE, and that direction is chosen
            // rather than inherited. This also runs for the synthesised report
            // written when the script died without producing one, which carries
            // no routing at all. A dead monitor during a real outage must reach
            // the real issue; being wrong the other way costs a rehearsal
            // touching the live issue, which is exactly the old behaviour and
            // so not a regression.
            const routing = r.routing || {};
            fs.writeFileSync("label.txt", routing.label || "source-alert");
            fs.writeFileSync("subject.txt", routing.subject || "Data sources");
            // Whether this reading came from a fixture. The notifier says so
            // in the FIRST line of the message, because that is what a phone
            // preview shows and a rehearsal must still ring. Absence resolves
            // to "not a rehearsal", the direction that never suppresses a real
            // alarm.
            //
            // No apostrophe may appear anywhere in this block. It is the body
            // of `node -e '...'`, and bash ends a single-quoted string at the
            // first one it meets — there is no escape for one inside. A prose
            // apostrophe here ends the script early and hands the remaining
            // JavaScript to bash. That is what happened in #348: a comment
            // used the possessive form of "message", the monitor died with a
            // bash syntax error, and the notifier reported that it had
            // produced no report to the real Telegram channel while all
            // twelve sources were healthy.
            fs.writeFileSync("rehearsal.txt", routing.rehearsal || "false");
          '

          # Hand the report to the notification job. The delimiter form is
          # required: the report is multi-line, and a bare `key=value` would
          # silently keep only its first line.
          {
            echo "headline<<__EOF__"
            cat headline.txt
            echo ""
            echo "__EOF__"
            echo "message<<__EOF__"
            cat message.txt
            echo ""
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

          # Single-line, so the plain form is correct and the delimiter form
          # would only add a way to get it wrong.
          echo "label=$(cat label.txt)" >> "$GITHUB_OUTPUT"
          echo "subject=$(cat subject.txt)" >> "$GITHUB_OUTPUT"
          echo "rehearsal=$(cat rehearsal.txt)" >> "$GITHUB_OUTPUT"

      - name: Attach the shape received
        run: |
          set -euo pipefail
          {
            echo "<details><summary>Shape received</summary>"
            echo
            echo '```'
            sed -n '/--- shape received ---/,/----------------------/p' console.txt || true
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Notification
  # ---------------------------------------------------------------------------
  #
  # `if: always()` and the `result != 'success'` test below are the point of
  # splitting this into two jobs, and they close a real hole.
  #
  # If the check job dies outright -- a runner failure, a cancelled step, a
  # `node` that will not start -- it produces no outputs at all. With an
  # ordinary `needs:` this job would be *skipped*, and the run would go red and
  # silent: no issue, no message, at the exact moment the monitor has most to
  # say. That is "absence resolves to success" wearing the dependency graph's
  # clothes.
  #
  # So a check job that did not succeed is itself an alert, and the notifier
  # substitutes a stated message when it is handed none.

  notify:
    name: Notify
    needs: check
    if: always()
    uses: ./.github/workflows/alert-notify.yml
    with:
      alert: ${{ (needs.check.result != 'success' || needs.check.outputs.alert == 'true') && 'true' || 'false' }}
      headline: ${{ needs.check.outputs.headline }}
      message: ${{ needs.check.outputs.message }}
      # The probe decides which issue this belongs in, so a rehearsal cannot
      # retitle a live outage or manufacture one on healthy sources. The `||`
      # covers the check job dying outright, where there is no output at all:
      # absence resolves to the LIVE issue, because a dead monitor during a real
      # outage must reach the real one, and an empty label would make
      # `gh issue list --label ''` match nothing.
      label: ${{ needs.check.outputs.label || 'source-alert' }}
      subject: ${{ needs.check.outputs.subject || 'Data sources' }}
      # Absence resolves to 'false' — a real alarm that lost its flag must not be
      # dressed as a rehearsal, which is the one direction that could get a live
      # outage ignored.
      rehearsal: ${{ needs.check.outputs.rehearsal || 'false' }}
    secrets: inherit
