name: CI/CD

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

# Serialize deploys per ref so a burst of merges (e.g. Dependabot) cancels older
# in-progress runs gracefully instead of racing into Azure SWA ("Deployment Canceled").
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality Gate ────────────────────────────────────────────────────
  quality:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 20 reached end of life in April 2026, and the dependency tree
          # has already moved past it: undici@8 (via jsdom) calls
          # webidl.util.markAsUncloneable, which does not exist on 20, so the
          # test suite cannot start there. The build happened to survive because
          # it never imports undici — a latent split between the runtime the code
          # is built on and the one its dependencies require.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      # 34 unit tests existed in this repo and no workflow ran any of them, so
      # "we have tests" bought nothing. Added here rather than as a new workflow:
      # this job already pays for checkout and `npm ci`, which is the expensive
      # part, so the marginal cost is the suite itself and no extra run.
      - name: Test
        run: npm test

  # ── Build & Deploy ─────────────────────────────────────────────────
  build_and_deploy:
    needs: quality
    # Fork PRs get a read-only token and no secrets, so the SWA token is empty
    # and this job could only fail for them. Phrased negatively on purpose:
    # github.event.pull_request is null on push/workflow_run, so a bare
    # `head.repo.full_name == github.repository` reads false there and would
    # disable deployment entirely. This constrains pull_request events only.
    if: >-
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install & build frontend
        run: npm ci && npm run build

      - name: Install API deps
        run: cd api && npm ci

      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true

      - name: Notify Telegram (success)
        if: success() && github.event_name == 'push'
        env:
          NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
          NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [ -z "$NAURO_BOT_TOKEN" ] && { echo "NAURO_BOT_TOKEN not set; skipping"; exit 0; }
          COMMIT_MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          curl -sf -X POST "https://api.telegram.org/bot${NAURO_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${NAURO_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=✅ <b>portaBaltica</b> deployed
          Branch: ${{ github.ref_name }}
          Commit: ${COMMIT_MSG}
          SHA: ${{ github.sha }}
          URL: https://portabaltica.naurolabs.com" \
            || echo "::warning::Telegram notification failed"

      - name: Notify Telegram (failure)
        if: failure() && github.event_name == 'push'
        env:
          NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
          NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [ -z "$NAURO_BOT_TOKEN" ] && { echo "NAURO_BOT_TOKEN not set; skipping"; exit 0; }
          COMMIT_MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          curl -sf -X POST "https://api.telegram.org/bot${NAURO_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${NAURO_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=❌ <b>portaBaltica</b> deploy FAILED
          Branch: ${{ github.ref_name }}
          Commit: ${COMMIT_MSG}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::Telegram notification failed"

      - name: Sync landing page order
        if: success() && github.event_name == 'push'
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/samoletovs/naurolabs/dispatches \
            -d '{"event_type": "project-deployed", "client_payload": {"project": "portaBaltica"}}' \
            || echo "::warning::Landing page sync dispatch failed"

  # ── Close PR preview ───────────────────────────────────────────────
  close_pull_request:
    # Fork PRs get a read-only token and no secrets, so the SWA token is empty
    # and this job could only fail for them. Phrased negatively on purpose:
    # github.event.pull_request is null on push/workflow_run, so a bare
    # `head.repo.full_name == github.repository` reads false there and would
    # disable deployment entirely. This constrains pull_request events only.
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          action: close
          app_location: /
