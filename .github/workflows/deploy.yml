name: CI/CD

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

# Serialize deploys so a burst of merges cannot race into Azure SWA
# ("Deployment Canceled"). Serialization is the goal; cancelling is not.
#
# The group is keyed on the event as well as the ref. Merging a PR fires a
# `push` to master and a `pull_request: closed` in the same second, and with a
# ref-only key those two runs evicted each other. The push run is the only one
# that deploys production, and it lost the race twice on 2026-08-24 — cancelled
# 2 and 3 seconds after creation, before a single job started:
#
#   7b180bd (#18)  created 13:36:11  cancelled 13:36:13
#   e5aae8f (#22)  created 13:58:32  cancelled 13:58:35
#
# Both merges reported fully green while production kept serving the previous
# build. Nothing anywhere turned red, because a cancelled run is not a failed
# one. #18 shipped only after someone noticed the deployed API still answering
# with the old version and re-ran the job by hand.
#
# `cancel-in-progress` is therefore false for pushes: consecutive master
# deploys queue and every merged commit reaches production. Pull request runs
# still cancel when superseded, which is where the Actions minutes actually go.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # ── Quality Gate ────────────────────────────────────────────────────
  quality:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 20 reached end of life in April 2026, and the dependency tree
          # has already moved past it: undici@8 (via jsdom) calls
          # webidl.util.markAsUncloneable, which does not exist on 20, so the
          # test suite cannot start there. The build happened to survive because
          # it never imports undici — a latent split between the runtime the code
          # is built on and the one its dependencies require.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      # 34 unit tests existed in this repo and no workflow ran any of them, so
      # "we have tests" bought nothing. Added here rather than as a new workflow:
      # this job already pays for checkout and `npm ci`, which is the expensive
      # part, so the marginal cost is the suite itself and no extra run.
      #
      # There is deliberately NO `npm run build` step here. One was added when
      # `tests/deployRecovery.test.ts` read `dist/index.html`, but that test now
      # reads the source instead — precisely because a `dist/` left lying in a
      # working directory is whatever the last build produced, which is how a
      # real failure passed locally and went red in CI from #134 onward. Nothing
      # in `tests/` reads `dist/` any more, so building here would feed nobody.
      #
      # It is not needed to catch a build break either: `build_and_deploy` runs
      # `npm ci && npm run build` on pull_request as well as push, and only the
      # *upload* step is push-only. So a Vite failure still fails a PR, one job
      # to the right. Re-adding a build here costs a second full build per run
      # and buys nothing.
      - name: Test
        run: npm test

  # ── Build & Deploy ─────────────────────────────────────────────────
  build_and_deploy:
    needs: quality
    # Fork PRs get a read-only token and no secrets, so the SWA token is empty
    # and this job could only fail for them. Phrased negatively on purpose:
    # github.event.pull_request is null on push/workflow_run, so a bare
    # `head.repo.full_name == github.repository` reads false there and would
    # disable deployment entirely. This constrains pull_request events only.
    if: >-
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install & build frontend
        env:
          # The published articles live in the `articles` blob container, which
          # the newsroom Function writes to on a timer. The browser fetches them
          # directly: Static Web Apps cannot proxy a route to an external host,
          # and SWA Free cannot hold a managed identity to read the blob on the
          # reader's behalf, so a same-origin path is not available to us.
          #
          # Only this container is anonymously readable, and only for GET/HEAD.
          # `raw-feeds` and `approvals` stay private, and the account keeps
          # allowSharedKeyAccess=false. Published journalism is public by
          # definition; the archive and the approval queue are not.
          VITE_ARTICLES_BASE_URL: https://stportabalticabpmff5so.blob.core.windows.net/articles
          VITE_BRIEFING_ENQUIRIES_OPEN: ${{ vars.VITE_BRIEFING_ENQUIRIES_OPEN }}
        run: npm ci && npm run build

      - name: Install API deps
        run: cd api && npm ci

      # Push only. A pull_request upload does not go to production — Azure
      # creates a *staging environment* per PR, and the Free tier caps those at
      # three. With more PRs open than that, every further PR run died on:
      #
      #   The content server has rejected the request with: BadRequest
      #   Reason: This Static Web App already has the maximum number of staging
      #   environments. Please remove one and try again.
      #
      # That is not a failure of the change under review; it is a quota that a
      # PR cannot do anything about, and it turned the deploy job into a red
      # mark that everyone learns to ignore. The steps above still build the
      # frontend and install the API deps on every PR, so a build break is
      # caught before merge. Previews are what we give up, and on a three-slot
      # cap shared by a bot-driven PR queue they were never dependable anyway.
      - name: Deploy to Azure SWA
        id: deploy
        if: github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true

      # The browser the layout and contrast checks need.
      #
      # Without this, `browserType.launch()` throws, both browser-based live
      # tests take their "no chromium binary — skipping" path, and the suite
      # reports 2 passed in about three seconds having measured nothing. That
      # is what happened: `reducedMotionLayout.live.test.ts` has existed since
      # #109 and had never executed on a runner, so it could not have reported
      # the sideways scroll it was written to catch — and did not, for a fix
      # that took three weeks to notice.
      #
      # `tests/liveBrowser.ts` now turns that skip into a failure whenever CI
      # is set, so a runner that cannot launch a browser says so instead of
      # passing. This step is what keeps that from firing.
      - name: Install Playwright browser
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium

      # Live smoke tests run HERE, against what was just deployed — not in the
      # PR gate, where they only measured production's latency from a runner
      # and could fail a correct change because a Free-tier Function was cold.
      #
      # Defer failure only until the upload and verification outcomes have been
      # reported separately. The final step fails unverified deployments; it
      # does not roll back the code that is already live.
      - name: Live smoke tests
        id: smoke
        if: github.event_name == 'push'
        continue-on-error: true
        run: npm run test:live

      - name: Report smoke result
        if: always() && github.event_name == 'push' && steps.deploy.outcome == 'success'
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "Live smoke tests passed against the deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Live smoke tests FAILED after deploy" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The code is live. Live verification failed; inspect failed assertions." >> "$GITHUB_STEP_SUMMARY"
            echo "A skipped suite also leaves this deployment unverified; inspect preceding setup steps." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Report successful upload even if browser setup failed and smoke was
      # skipped. Only successful verification earns a tick. Keep both messages
      # before the final failure so a live-check failure is not called an
      # upload failure.
      - name: Notify Telegram (success)
        if: always() && github.event_name == 'push' && steps.deploy.outcome == 'success'
        env:
          NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
          NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NAURO_BOT_TOKEN" ] && { echo "NAURO_BOT_TOKEN not set; skipping"; exit 0; }
          COMMIT_MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            HEADLINE="✅ <b>portaBaltica</b> deployed"
            TAIL="URL: https://portabaltica.naurolabs.com"
          else
            HEADLINE="⚠️ <b>portaBaltica</b> deployed — LIVE CHECKS FAILED"
            TAIL="The code is live. Live verification failed; inspect failed assertions.
          If the suite was skipped, inspect preceding setup steps.
          Run: ${RUN_URL}"
          fi
          curl -sf -X POST "https://api.telegram.org/bot${NAURO_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${NAURO_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${HEADLINE}
          Branch: ${{ github.ref_name }}
          Commit: ${COMMIT_MSG}
          SHA: ${{ github.sha }}
          ${TAIL}" \
            || echo "::warning::Telegram notification failed"

      - name: Notify Telegram (failure)
        if: failure() && github.event_name == 'push' && steps.deploy.outcome != 'success'
        env:
          NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
          NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [ -z "$NAURO_BOT_TOKEN" ] && { echo "NAURO_BOT_TOKEN not set; skipping"; exit 0; }
          COMMIT_MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          curl -sf -X POST "https://api.telegram.org/bot${NAURO_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${NAURO_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=❌ <b>portaBaltica</b> deploy FAILED
          Branch: ${{ github.ref_name }}
          Commit: ${COMMIT_MSG}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::Telegram notification failed"

      - name: Sync landing page order
        if: success() && github.event_name == 'push'
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/samoletovs/naurolabs/dispatches \
            -d '{"event_type": "project-deployed", "client_payload": {"project": "portaBaltica"}}' \
            || echo "::warning::Landing page sync dispatch failed"

      # Overall success means upload AND live verification. Notifications above
      # distinguish deployed from live-verified; a red run performs no rollback.
      - name: Fail unverified deployment
        if: always() && github.event_name == 'push' && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        run: |
          echo "::error::Live verification failed; inspect failed assertions. The code is live; no rollback was performed."
          exit 1

  # ── Close PR preview ───────────────────────────────────────────────
  # Pull requests no longer create staging environments (see the deploy step
  # above), so this is now a drain rather than a matching teardown: it clears
  # any environment left over from before that change, which is what has to
  # happen for the Free tier's three slots to come back.
  close_pull_request:
    # Fork PRs get a read-only token and no secrets, so the SWA token is empty
    # and this job could only fail for them. Phrased negatively on purpose:
    # github.event.pull_request is null on push/workflow_run, so a bare
    # `head.repo.full_name == github.repository` reads false there and would
    # disable deployment entirely. This constrains pull_request events only.
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          action: close
          app_location: /
