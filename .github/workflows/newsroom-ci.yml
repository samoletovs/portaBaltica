# name: Newsroom safety gate
#
# Two jobs, and the split matters.
#
# `validator` runs on every newsroom change wherever it is headed. It is kept
# out of the `CI/CD` workflow deliberately: that one is scoped to
# `branches: [main, master]` because it deploys, so it would not run on a PR
# targeting a feature branch — and this suite is exactly the one that must.
# The repo is public, so the Actions minutes are free.
#
# `deploy` publishes the Function App, and only from master. Until it existed
# the newsroom had no continuous deployment at all: the frontend shipped on
# every merge while the pipeline kept running whatever was last published by
# hand, so merged newsroom fixes simply never reached readers.
#
# What the gate protects:
#   * no article can be published with a number that traces to nothing
#   * no third-party journalism can be rewritten
#   * every correspondent byline discloses that it is an AI
# It must stay a required check. If it is failing, the correct response is to
# fix the article pipeline, never to loosen the invariant. Because `deploy`
# declares `needs: validator`, these invariants now gate shipping and not
# merely merging.
name: Newsroom safety gate

on:
  push:
    paths:
      - 'newsroom/**'
      - 'src/news-types.ts'
      - 'pytest.ini'
      - '.github/workflows/newsroom-ci.yml'
  pull_request:
    paths:
      - 'newsroom/**'
      - 'src/news-types.ts'
      - 'pytest.ini'
      - '.github/workflows/newsroom-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validator:
    name: Validator and invariants (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the Azure Functions Flex Consumption runtime gives
        # us; 3.12 is what a contributor is likely to have locally. The package
        # has to work on both, and nothing here needs a newer feature.
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            newsroom/requirements.txt
            newsroom/requirements-dev.txt

      - name: Install newsroom dependencies
        # requirements-dev.txt pulls in requirements.txt via -r, and adds the
        # test-only extras (pytest-asyncio, respx) the pipeline suite needs.
        # The runtime requirements stay deliberately tiny -- the safety package
        # must never gain an HTTP client or anything that could reach the
        # network from inside a check -- so the async extras belong here and
        # only here.
        run: python -m pip install --upgrade pip && pip install -r newsroom/requirements-dev.txt

      - name: Run the content-safety suite
        run: python -m pytest newsroom/tests -q

  deploy:
    name: Publish the pipeline to Azure
    # Nothing reached production before this job existed. The frontend has had
    # continuous deployment since the beginning (`CI/CD` → Azure Static Web
    # Apps), but the newsroom Function App had none: merging `newsroom/**` to
    # master changed the repository and nothing else, and the pipeline kept
    # running whatever was last published by hand.
    #
    # Deploying from CI also closes a documented production incident. From
    # `newsroom/README.md`:
    #
    #   > On 2026-08-24 a `func publish` from the main checkout deployed a
    #   > background agent's uncommitted, half-finished editor stage into
    #   > production.
    #
    # A publish from a working tree ships whatever happens to be on disk, which
    # in this repository is frequently somebody else's in-progress branch. This
    # job publishes a clean checkout of master, so what runs in production is
    # what was reviewed and merged.
    needs: validator
    # Never from a pull request, and never from a branch: a deploy is the one
    # thing that must not run on unmerged code. `needs: validator` makes the
    # safety suite a gate on shipping and not merely on merging.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for OIDC. There is deliberately no publish profile and no
      # deployment key: the identity is federated to this repository's master
      # ref, so a token cannot be replayed from anywhere else. It holds
      # `Website Contributor` on the Function App and `Storage Blob Data
      # Contributor` on its deployment storage — the two narrowest roles that
      # permit a Flex Consumption publish — scoped to those resources rather
      # than to the resource group or the subscription.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Must match the Function App's runtime. Flex Consumption is pinned to
          # Python 3.12 here.
          python-version: '3.12'

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish
        # `Azure/functions-action` rather than installing Azure Functions Core
        # Tools from npm: this runner's package proxy serves lockfile-resolved
        # installs but rejects an arbitrary `npm install -g` with E401, and the
        # official action needs no toolchain of its own. It also understands
        # Flex Consumption's deployment endpoint, which a zip-deploy does not.
        uses: Azure/functions-action@v1
        with:
          app-name: portabaltica-func
          package: newsroom
          # Build the wheels on the platform that will run them. The runner is
          # x64 Linux and so is the host, but the Python patch level differs,
          # and a locally-built wheel pinned to the wrong one fails to import at
          # start-up rather than at deploy time.
          remote-build: true

      - name: Stamp the deployed revision
        # So an article can say which code wrote it instead of it being
        # inferred from timestamps. `provenance.revision` is read from this
        # setting at runtime; when it is absent the article records
        # `revision_unavailable` and says so, rather than carrying a plausible
        # placeholder.
        #
        # AFTER the publish, deliberately. Setting it first would leave the app
        # asserting this SHA while still serving the previous package if the
        # publish then failed — which is precisely the false claim the field
        # exists to prevent.
        #
        # BEFORE the health check, also deliberately: writing an app setting
        # restarts the app, so the check below then validates the state the app
        # actually settles in rather than one it is about to leave.
        run: |
          set -euo pipefail
          az functionapp config appsettings set \
            --name portabaltica-func --resource-group portabaltica-rg \
            --settings "NEWSROOM_REVISION=${GITHUB_SHA}" --output none
          echo "NEWSROOM_REVISION=${GITHUB_SHA}"

      - name: Confirm the host came back with both timers registered
        # A publish that exits zero and leaves the app unable to load its
        # functions is the failure this catches. The timers are what matter: if
        # one is missing that cadence silently stops publishing, and that is
        # precisely the class of failure that went unnoticed here before.
        #
        # BOTH, enumerated. This checked `newsroom_edition` alone, which was
        # right when it was the only timer and became wrong the moment #108
        # added `newsroom_weekly` -- the consumer nobody edited, correct for
        # every case that existed when it was written. A weekly timer that
        # fails to register is *harder* to notice than a daily one, because
        # the silence it produces is only visible once a week.
        run: |
          set -euo pipefail
          required='newsroom_edition newsroom_weekly'
          for attempt in 1 2 3 4 5 6; do
            names="$(az functionapp function list \
              --name portabaltica-func --resource-group portabaltica-rg \
              --query '[].name' -o tsv 2>/dev/null || true)"
            echo "attempt ${attempt}: ${names}"
            missing=''
            for want in ${required}; do
              printf '%s' "${names}" | grep -q "${want}" || missing="${missing} ${want}"
            done
            if [ -z "${missing}" ]; then
              echo "registered:${required// / }"
              exit 0
            fi
            sleep 20
          done
          echo "::error::timers did not register after publish:${missing}"
          exit 1

      - name: Every templated setting is actually deployed
        # `main.bicep` says what the app SHOULD carry; nothing in this workflow
        # applies the template, so the two drift silently and did --
        # NEWSROOM_WEEKLY_SCHEDULE was declared in #108 and never deployed,
        # leaving the Bicep parameter a dead knob for three days while the app
        # ran on a code default that happened to match.
        #
        # `test_deployed_settings.py` catches this too, but against a recorded
        # snapshot: sound, and only as current as the last refresh. This is the
        # live half. Names only -- two of these settings are secrets.
        #
        # One-directional on purpose. Templated-but-not-deployed is a fault;
        # deployed-but-not-templated is not, because NEWSROOM_REVISION is set
        # by the step above and the two Telegram secrets are set by hand. An
        # equality here would fail every run.
        #
        # The pattern anchors on `{ name: 'X', value:` -- the appSettings entry
        # form -- rather than on `name: '[A-Z_]+'`, which was the first version
        # and matched `_LRS` out of a storage SKU plus an empty string, so it
        # would have reported two phantom missing settings and failed every
        # deploy. Measured against the live app before committing: 12 templated,
        # 12 deployed, 0 missing; and with one dropped from the deployed side it
        # names exactly that one. The three settings deployed but not templated
        # -- NEWSROOM_REVISION and the two Telegram secrets -- are correctly
        # ignored.
        #
        # Verifying this on Windows needs `tr -d '\r'` on the deployed side: the
        # comparison is exact, so a CR makes all twelve look missing. Runners
        # are Linux and `az -o tsv` emits bare newlines there, so the workflow
        # needs no such guard -- but a reader reproducing it locally will see
        # twelve false positives without one.
        run: |
          set -euo pipefail
          deployed="$(az functionapp config appsettings list \
            --name portabaltica-func --resource-group portabaltica-rg \
            --query '[].name' -o tsv | sort)"
          templated="$(grep -oE "\{ name: '[A-Za-z_]+', value:" infrastructure/main.bicep \
            | sed -E "s/^\{ name: '//; s/', value:$//" | sort -u)"
          missing="$(comm -23 <(printf '%s\n' "${templated}") <(printf '%s\n' "${deployed}") || true)"
          if [ -n "${missing}" ]; then
            echo "::error::declared in main.bicep and not deployed: ${missing}"
            exit 1
          fi
          echo "every templated setting is deployed."
