<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icons and the share card are served from our own origin, generated from
      public/favicon.svg. The CSP is `img-src 'self' data:`, and an asset
      fetched from anywhere else would disclose every reader's IP address to
      whoever served it — the same reason there are no webfonts, below.

      This used to be an inline ⚓ emoji data URI, which rendered as whatever
      the reader's platform draws for U+2693 and said "shipping company" for a
      site that stopped being maritime-only some time ago. A scaffold logo from
      an unrelated template also sat unused in public/.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Two theme colours, one per scheme, so the browser chrome matches the
      theme the reader is actually in rather than always claiming the dark one.
      These are `--bg-page` from src/index.css; if that moves, move these.
    -->
    <meta name="theme-color" content="#0a0f1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <title>portaBaltica — Baltic open data, reported</title>
    <meta name="description" content="Original data journalism from Baltic open data. Economy, energy, maritime, environment and government — every figure traceable to its dataset, with the live dashboard behind it." />
    <meta property="og:site_name" content="portaBaltica" />
    <meta property="og:title" content="portaBaltica — Baltic open data, reported" />
    <meta property="og:description" content="Original analysis of Baltic open data, written by disclosed AI correspondents and checked against the source before publication." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portabaltica.naurolabs.com" />
    <meta property="og:image" content="https://portabaltica.naurolabs.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="portaBaltica — Baltic open data, reported" />
    <meta property="og:locale" content="en_GB" />
    <!--
      `summary_large_image` rather than `summary`: the card is 1200×630 and a
      plain summary crops it to a square thumbnail, which cuts the wordmark in
      half. The card is typographic rather than a screenshot of the dashboard
      on purpose — a shared link is read at thumbnail size in a feed, where a
      screenshot of a chart grid is an unreadable grey rectangle.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="portaBaltica — Baltic open data, reported" />
    <meta name="twitter:description" content="Original analysis of Baltic open data, written by disclosed AI correspondents and checked against the source before publication." />
    <meta name="twitter:image" content="https://portabaltica.naurolabs.com/og.png" />
    <meta name="twitter:image:alt" content="portaBaltica — Baltic open data, reported" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://portabaltica.naurolabs.com" />
    <link rel="alternate" type="application/rss+xml" title="portaBaltica" href="/rss.xml" />
    <!--
      No webfonts at all, which is deliberate rather than an omission.

      This site used to request Inter from Google Fonts. That never worked: our
      CSP is `style-src 'self' 'unsafe-inline'` and `font-src 'self' data:`, so
      the browser blocked the request for the site's entire life and quietly
      fell back to the system stack. Every page load spent two failed requests
      and two console errors to render exactly what it rendered anyway.

      We did not simply widen the CSP, because fetching fonts from Google
      discloses every reader's IP address to a third party on page load. German
      courts have held that to be a GDPR violation, and a news site read in the
      EU is the last place to take that risk for a typeface.

      Self-hosting an editorial serif was tried and reverted: it split the site
      into two families, one for the newsroom and one for the dashboard, which
      read as two products rather than as two registers. The type scale in
      src/index.css carries the hierarchy instead, and text renders in the
      platform's own UI face — which is what readers have been seeing all
      along, costs nothing to serve, and is the right answer for an interface.
    -->
    <script>
      // Prevent theme flash: set data-theme before CSS applies
      (function(){var t=localStorage.getItem('pb-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
    </script>
    <!--
      Recover from a deploy that lands mid-visit.

      Vite gives every bundle a content hash, and Static Web Apps replaces the
      asset set on deploy rather than keeping the previous one alongside —
      measured: every hash this site served earlier today now answers 404. So a
      reader holding HTML from before a deploy is holding filenames that no
      longer exist. On ~20 deploys in a day that window opens ~20 times.

      There are two failures and they are not equally visible:

        - a LAZY CHUNK 404s. React is running, the error boundary catches it,
          and the reader gets "Something went wrong" over the text "Failed to
          fetch dynamically imported module" and a Reload button they have to
          find and press. Handled, but handled badly: the message describes our
          build system to someone who wanted to read an article.

        - the MAIN BUNDLE 404s. Nothing boots, so the error boundary does not
          exist to catch anything. The reader gets a blank page.

      The second is why this lives here rather than in src/. No code in the
      bundle can catch the bundle failing to load, so a React-side retry — the
      usual advice — covers only the first case by construction.

      Both are the same event to a browser, and both are catchable from here:
      a failed <script> is an `error` event on the element, which only capture
      phase sees, and a failed import() is an unhandled promise rejection.

      The reload is guarded and deliberately timid. It happens at most once per
      thirty seconds per tab, so if reloading does not help — a genuinely broken
      deploy, an offline reader, an extension eating requests — the page fails
      visibly instead of thrashing. Verified in Chromium against a server whose
      assets always 404: exactly two loads over six seconds, not a loop. If
      sessionStorage throws, we do nothing at all, because the alternative is
      an unbounded reload with no way to count.

      `location.reload()` sends `Cache-Control: max-age=0` — measured, not
      assumed — and /api/article-page reads that as "do not serve the shell you
      have in memory". Without that the reload would be handed the same HTML
      naming the same dead bundle, the guard below would refuse a second
      attempt, and the reader would stay on the blank page.
    -->
    <script>
      (function () {
        var KEY = 'pb-asset-recovery';
        function recover() {
          try {
            var last = parseInt(sessionStorage.getItem(KEY) || '0', 10);
            if (Date.now() - last < 30000) return;
            sessionStorage.setItem(KEY, String(Date.now()));
            location.reload();
          } catch (e) { /* no sessionStorage: never reload rather than risk a loop */ }
        }
        window.addEventListener('error', function (event) {
          var el = event.target;
          // A resource that failed to load, not a runtime error: those report
          // window as their target and must not trigger anything.
          if (el && el.tagName === 'SCRIPT' && /\/assets\//.test(el.src || '')) recover();
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var message = (event.reason && event.reason.message) || '';
          if (/dynamically imported module|Importing a module script failed/i.test(message)) recover();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
