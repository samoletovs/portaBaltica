# portaBaltica — source registry
#
# The legal spine of the newsroom. Every piece of ingested content must map to
# an entry here, and the entry decides what the pipeline is permitted to do
# with it. There is no default: content from an unregistered source is dropped.
#
# TIERS
# -----
#   A  Original data journalism. We pull structured open data and write our own
#      analysis. We own the resulting article outright. This is the product.
#
#   B  Verbatim reproduction permitted. Official press material that an explicit
#      licence lets us republish in full with attribution. We do not rewrite it —
#      rewriting would add legal risk for no editorial gain.
#
#   C  Link-out only. Third-party journalism. We may show the headline, the
#      snippet THE OUTLET THEMSELVES published in their RSS <description>, and a
#      link back. Nothing more. Never a rewrite, never a paraphrase, never the
#      article body, never <content:encoded>.
#
# WHY TIER C IS SO NARROW
# -----------------------
# Two independent constraints bite here, and they point the same way:
#   * EU DSM Directive 2019/790 Art. 15 gives press publishers a neighbouring
#     right over online reuse, transposed in LV, EE and LT since 2021. Only
#     hyperlinks and "individual words or very short extracts" are carved out.
#     The outlet's own RSS snippet is the largest unit we can defend, because
#     they published it for syndication themselves.
#   * Google's scaled content abuse policy (March 2024) explicitly names
#     "scraping feeds ... automated transformations like synonymizing,
#     translating, or other obfuscation techniques" as spam. AI-paraphrasing a
#     feed is the single fastest way to get this portal deindexed.
#
# So `rewrite_allowed: false` on tier C is not caution. It is the only setting
# under which the portal survives both a legal challenge and a core update.

version: 1

defaults:
  rewrite_allowed: false
  requires_human_approval: false
  cache_ttl_minutes: 60

sources:

  # ─────────────────────────────────────────────────────────────────────
  # TIER A — structured open data. We write original analysis from these.
  # ─────────────────────────────────────────────────────────────────────

  - id: eurostat
    name: "Eurostat"
    publisher: "European Commission"
    tier: A
    endpoint: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/{dataset}"
    verified: "2026-08-24 — HTTP 200"
    # ec.europa.eu also carries the Commission's Press Corner, so both entries
    # must say which paths they own. Without this the host is ambiguous and the
    # registry refuses to load — see `_index_by_host`.
    path_prefixes:
      - "/eurostat/api"
    auth: none
    licence: "EU Decision 2011/833/EU — free reuse with attribution"
    attribution: "Source: Eurostat"
    rewrite_allowed: true
    requires_human_approval: false
    update_frequency: "varies — GDP/HICP monthly to quarterly, population annual"
    cache_ttl_minutes: 720
    notes: "Primary cross-country comparison source. Best single source for LV/EE/LT divergence stories."

  - id: ecb
    name: "European Central Bank"
    publisher: "ECB"
    tier: A
    endpoint: "https://data-api.ecb.europa.eu/service/data/{flowRef}/{key}"
    auth: none
    licence: "Free reuse with attribution"
    attribution: "Source: European Central Bank"
    rewrite_allowed: true
    requires_human_approval: false
    update_frequency: "daily (FX), monthly (rates)"
    cache_ttl_minutes: 720

  - id: elering
    name: "Elering day-ahead electricity prices"
    publisher: "Elering AS (Estonian TSO)"
    tier: A
    endpoint: "https://dashboard.elering.ee/api/nps/price"
    verified: "2026-08-24 — HTTP 200"
    auth: none
    licence: "Open, attribution required"
    attribution: "Source: Elering / Nord Pool"
    rewrite_allowed: true
    requires_human_approval: false
    update_frequency: "hourly; day-ahead published ~13:00 CET"
    cache_ttl_minutes: 30
    notes: >-
      Historically an unofficial public API. Request formal open-data access
      from Elering before this portal is promoted publicly.

  - id: datagovlv
    name: "data.gov.lv (CKAN)"
    publisher: "Republic of Latvia"
    tier: A
    endpoint: "https://data.gov.lv/dati/api/3/action/datastore_search"
    auth: none
    licence: "CC BY 4.0 / CC0 — varies per dataset, check per resource"
    attribution: "Source: data.gov.lv"
    rewrite_allowed: true
    requires_human_approval: false
    update_frequency: "daily to biweekly per dataset"
    cache_ttl_minutes: 1440

  - id: statee
    name: "Statistics Estonia PxWeb"
    publisher: "Statistikaamet"
    tier: A
    endpoint: "https://andmed.stat.ee/api/v1/en/stat"
    auth: none
    licence: "CC BY 4.0"
    attribution: "Source: Statistics Estonia"
    rewrite_allowed: true
    requires_human_approval: false
    cache_ttl_minutes: 1440
    # Registered and fetched by nothing. Measured 2026-08-28 across the whole
    # repository: the only references are this entry, two display-name maps in
    # `src/` and a correspondent's dataset list. `opendata.py` collects from
    # `eurostat` and `elering` only.
    #
    # NOT marked `enabled: false`, deliberately, and the reason is worth
    # stating because the flag looks like it would retire this. It would not:
    # `enabled` is read in exactly two places — `run.py:197`, which filters to
    # tier B and C, and `scripts/wire_check.py`. `opendata.py` calls
    # `registry().get(...)` directly and never consults it. So for a tier A
    # source the flag gates nothing, and setting it here would have one real
    # effect: dropping this id from the "not probed by this check" list that
    # `wire_check.py` prints on every run. That would make the *only* standing
    # mention of this problem disappear while the problem remained — hiding the
    # finding rather than recording it.
    #
    # The live defect is in `src/newsroom/correspondents.ts`, which tells
    # readers that Ilze Nida works from this dataset. That is a public claim
    # about a source nothing reads, and fixing it means editing `src/`.
    notes: >
      Registered but fetched by nothing (measured 2026-08-28, repository-wide).
      Kept for its licence and attribution. `enabled` is not a retirement switch
      for tier A -- it is only consulted for tiers B and C -- so this is recorded
      here rather than flipped. src/newsroom/correspondents.ts publicly lists
      this as a dataset a correspondent works from, which is currently untrue.

  - id: datagovlt
    name: "data.gov.lt"
    publisher: "Republic of Lithuania"
    tier: A
    endpoint: "https://data.gov.lt/api/3/action/package_search"
    auth: none
    licence: "CC BY 4.0"
    attribution: "Source: data.gov.lt"
    rewrite_allowed: true
    requires_human_approval: false
    cache_ttl_minutes: 1440
    # Same measurement and the same reasoning as `statee` above.
    notes: >
      Registered but fetched by nothing (measured 2026-08-28, repository-wide).
      Kept for its licence and attribution. `enabled` is not a retirement switch
      for tier A -- it is only consulted for tiers B and C -- so this is recorded
      here rather than flipped. src/newsroom/correspondents.ts publicly lists
      this as a dataset a correspondent works from, which is currently untrue.

  - id: openmeteo
    name: "Open-Meteo"
    publisher: "Open-Meteo"
    tier: A
    endpoint: "https://api.open-meteo.com/v1/forecast"
    auth: none
    licence: "CC BY 4.0 — free for non-commercial and commercial use"
    attribution: "Weather data by Open-Meteo.com"
    rewrite_allowed: true
    requires_human_approval: false
    cache_ttl_minutes: 60

  # ─────────────────────────────────────────────────────────────────────
  # TIER B — official press material we may reproduce verbatim.
  # Reproduced whole, attributed, never rewritten.
  # ─────────────────────────────────────────────────────────────────────

  - id: ec_presscorner
    name: "European Commission Press Corner"
    publisher: "European Commission"
    tier: B
    endpoint: "https://ec.europa.eu/commission/presscorner/api/rss?language=en"
    verified: "2026-08-28 — HTTP 200, 10 items parsed by scripts/wire_check.py"
    # Both the Press Corner and Eurostat's editorial pages are European
    # Commission material under the same EU Decision 2011/833/EU licence, and
    # both are narrative rather than data — so this entry owns them. The
    # Eurostat paths matter: `products-euro-indicators` is the monthly release
    # that says WHICH sector moved a producer price index, and
    # `products-eurostat-news` carries the explanatory pieces. Those are the
    # documents that answer the question the causal panel exists to ask, and
    # until the host collision was fixed neither could be reached.
    #
    # Eurostat publishes no RSS feed for them — verified 2026-08-30, five
    # candidate paths all HTTP 404 — so they arrive through search discovery,
    # which is exactly what `resolve_to_registered` was built to gate.
    path_prefixes:
      - "/commission/presscorner"
      - "/eurostat/web/products-euro-indicators"
      - "/eurostat/web/products-eurostat-news"
    auth: none
    licence: "EU Decision 2011/833/EU — reproduction permitted, source acknowledged, content not distorted"
    attribution: "Source: European Commission"
    rewrite_allowed: false     # permitted, but we choose verbatim: no distortion risk
    requires_human_approval: false
    research_role: official_statement
    research_language: en
    research_summary_allowed: true
    document_fetch_allowed: true
    filter: "Baltic relevance — mentions Latvia, Estonia, Lithuania, Baltic, or an EU-wide measure with regional effect"
    cache_ttl_minutes: 60

  - id: ep_news
    name: "European Parliament news"
    publisher: "European Parliament"
    tier: B
    endpoint: "https://www.europarl.europa.eu/rss/doc/top-stories/en.xml"
    verified: "2026-08-28 — HTTP 202 with a zero-byte body. Dead."
    auth: none
    licence: "EU Decision 2011/833/EU — free reuse with attribution"
    attribution: "Source: European Parliament"
    rewrite_allowed: false
    requires_human_approval: false
    research_role: official_statement
    research_language: en
    research_summary_allowed: true
    document_fetch_allowed: true
    enabled: false
    cache_ttl_minutes: 120
    notes: >-
      Disabled 2026-08-28. Every run since at least 08-27 logged
      "ep_news: feed did not parse (no element found: line 1, column 0)",
      because the endpoint answers HTTP 202 Accepted with a ZERO-BYTE body —
      a status that reads as success to anything checking `response.ok`.
      Measured from an ordinary connection, off Azure, so this is not the
      egress problem that makes Riga Open Data look dead: 5 sequential
      attempts, 3 different europarl.europa.eu RSS paths (top-stories,
      press-releases, /news/en/rss) and 2 user agents, all 202/0 bytes.
      Whatever replaced it is not at these URLs. In the same probe LSM and ERR
      returned 200 with 50 items each, which is the control proving the
      instrument worked. Official EU statements are still covered by
      `ec_presscorner`, which returned 200 with 10 items in the same sweep.
      Re-enable if the European Parliament publishes a feed again; the Council
      is not a substitute, consilium.europa.eu answers 403.

  # ECB press releases. All three Baltic states are in the euro area, so the
  # ECB's own commentary is primary source material for every inflation, rate
  # and credit story this wire runs — and it is the single best answer to the
  # question the pipeline could never previously address: why did this move?
  #
  # A different host from the tier A `ecb` data API (data-api.ecb.europa.eu),
  # so host resolution stays unambiguous.
  - id: ecb_press
    name: "European Central Bank press"
    publisher: "European Central Bank"
    tier: B
    endpoint: "https://www.ecb.europa.eu/rss/press.html"
    verified: "2026-08-28 — HTTP 200, 15 items parsed by scripts/wire_check.py; English confirmed 2026-08-26 by reading titles"
    auth: none
    licence: "ECB copyright: reproduction for educational and non-commercial purposes permitted with acknowledgement"
    attribution: "Source: European Central Bank"
    rewrite_allowed: false
    requires_human_approval: false
    research_role: official_statement
    research_language: en
    research_summary_allowed: true
    document_fetch_allowed: true
    # Research context only. The wire does not republish ECB press releases as
    # cards; it reads them to explain its own figures.
    research_only: true
    cache_ttl_minutes: 180

  - id: latvijas_banka_news
    name: "Latvijas Banka news"
    publisher: "Latvijas Banka"
    country: LV
    tier: B
    endpoint: "https://www.bank.lv/en/news-and-events/news-and-articles/news?format=feed&type=rss"
    verified: "2026-08-28 — HTTP 200, RSS 2.0, 10 items parsed by scripts/wire_check.py; English confirmed 2026-08-24 by reading titles"
    language: en
    auth: none
    licence: "Official primary-source material; research context with attribution only"
    attribution: "Source: Latvijas Banka"
    rewrite_allowed: false
    requires_human_approval: false
    research_role: official_statement
    research_language: en
    research_summary_allowed: true
    document_fetch_allowed: true
    research_only: true
    cache_ttl_minutes: 720

  # ─────────────────────────────────────────────────────────────────────
  # TIER C — link-out only. Headline + the outlet's own RSS snippet + link.
  # rewrite_allowed is false on every entry and must stay that way.
  # ─────────────────────────────────────────────────────────────────────

  - id: lsm_en
    name: "LSM.lv English"
    publisher: "Latvijas Sabiedriskie Mediji (Latvian Public Media)"
    country: LV
    tier: C
    endpoint: "https://eng.lsm.lv/rss"
    verified: "2026-08-28 — HTTP 200, 50 items parsed by scripts/wire_check.py; language=en confirmed 2026-08-24"
    auth: none
    licence: "Copyright LSM. No open reuse licence. RSS snippet + link only."
    attribution: "LSM.lv English"
    rewrite_allowed: false
    requires_human_approval: false
    research_role: prior_coverage
    research_language: en
    max_snippet_source: "rss_description_verbatim"
    cache_ttl_minutes: 30
    notes: >-
      Best English-language Latvian source. Found during endpoint validation —
      an earlier research pass wrongly reported that no English LSM feed
      existed, having only tried lsm.lv/en/rss which redirects to the Latvian
      feed. The working host is eng.lsm.lv.

  - id: err_en
    name: "ERR News (English)"
    publisher: "Eesti Rahvusringhääling (Estonian Public Broadcasting)"
    country: EE
    tier: C
    endpoint: "https://news.err.ee/rss"
    verified: "2026-08-28 — HTTP 200, 50 items parsed by scripts/wire_check.py"
    auth: none
    licence: "Copyright ERR, declared in feed. RSS snippet + link only."
    attribution: "ERR News"
    rewrite_allowed: false
    requires_human_approval: false
    research_role: prior_coverage
    research_language: en
    max_snippet_source: "rss_description_verbatim"
    cache_ttl_minutes: 30
    notes: >-
      Feed declares <language>et</language> despite English content — a metadata
      error on their side, not a content signal.

      2026-09-01, and deliberately not recorded in verified:. This feed answered
      HTTP 403 to a GitHub Actions runner at 06:54Z (wire-alert run 33479592219,
      1070 bytes, 0 items) and the alert advised editing the verified: note to
      match. Measured the same morning with the same user agent, it answered
      HTTP 200 with 50 items to scripts/wire_check.py from an unrelated network
      at 07:15Z; and the collector, which fetches from Azure rather than from a
      runner, had published 27 ERR-attributed cards in the 14:08Z edition the
      day before. So the 403 was a reading of one network path. A verified: line
      is a claim about the publisher, and writing 403 into it would have made
      this file assert something false about a third party.

      The control that makes that checkable is in this same file: baltictimes
      answered 403 from that unrelated network on that same day, from the same
      machine that err_en answered 200 to. Both produce an identical
      "FAIL … HTTP 403" line, and only one of them is a dead publisher.

      2026-09-01, later the same day. The refusal is INTERMITTENT from the one
      vantage, which is the fact that settles it, and it is visible only across
      runs rather than in any single reading. From GitHub Actions: 403 at 06:53Z,
      07:39Z and 08:19Z, then HTTP 200 with 35 466 bytes and 50 items at 08:45Z,
      then 403 again at 11:59Z and 12:16Z — the same runner fleet, the same user
      agent, twenty-six minutes apart. No dead publisher recovers for one run and
      then stops again; a bot-protection challenge sampling traffic does exactly
      that, and the refused body carries Cloudflare's own window.__CF$cv$params.

      Re-measured that afternoon from an ordinary connection in Riga, with the
      pipeline's user agent: HTTP 200, 35 966 bytes, 50 items. baltictimes was
      probed in the same pass from the same machine and answered HTTP 403 with
      0 items, so the reading is not "this network reaches everything".

      This is why scripts/wire_check.py has a third severity rather than two.
      Measured across every run GitHub still retains, all five genuine failures
      were this source and this reading, and none was anything else — so the
      alarm was wrong every time it fired. verified: is still not edited: an
      intermittent refusal of one vantage is not a fact about the publisher, and
      this note is where it belongs.

  - id: baltictimes
    name: "The Baltic Times"
    publisher: "The Baltic Times"
    country: "Baltic"
    tier: C
    endpoint: "https://www.baltictimes.com/rss/"
    verified: "2026-08-28 — HTTP 403. Dead."
    auth: none
    licence: "Copyright. No open licence located. RSS snippet + link only."
    attribution: "The Baltic Times"
    rewrite_allowed: false
    requires_human_approval: false
    research_role: prior_coverage
    research_language: en
    max_snippet_source: "rss_description_verbatim"
    enabled: false
    cache_ttl_minutes: 60
    notes: >-
      Disabled 2026-08-28. Every run since at least 08-27 logged
      "baltictimes: HTTP 403, not retryable". Measured from an ordinary
      connection, off Azure, so this is a block rather than the egress problem
      that makes Riga Open Data look dead: 403 on /rss/, /rss and /feed/, with
      a browser user agent, twice each. LSM and ERR returned 200 with 50 items
      in the same sweep, which is the control proving the instrument worked.
      The licence was already "copyright, no open licence located", so this
      was a link-only tier C card and nothing downstream depended on it.
      Re-enable only if they stop refusing us; do not work around a 403 by
      disguising the client, because the 403 IS their answer.

  - id: emerging_europe
    name: "Emerging Europe"
    publisher: "Emerging Europe Ltd"
    country: "Regional"
    tier: C
    endpoint: "https://emerging-europe.com/feed/"
    verified: "2026-08-28 — HTTP 200, 10 items parsed by scripts/wire_check.py"
    auth: none
    licence: "Copyright. RSS snippet + link only."
    attribution: "Emerging Europe"
    rewrite_allowed: false
    requires_human_approval: false
    research_role: prior_coverage
    research_language: en
    max_snippet_source: "rss_description_verbatim"
    cache_ttl_minutes: 120
    notes: >-
      DANGER: this feed includes <content:encoded> carrying the full article
      body. The parser must read <description> only. Ingesting content:encoded
      would be republication of a complete copyrighted work.

  - id: delfi_global
    name: "Delfi (global channel)"
    publisher: "Delfi UAB"
    country: LT
    tier: C
    endpoint: "https://feed.delfi.lt/v2/channel/global?format=rss"
    verified: "2026-08-28 — HTTP 200, 50 items parsed by scripts/wire_check.py. The feed is alive; it stays disabled because the open question is whether the channel serves English, which the probe does not check"
    auth: none
    licence: "Copyright, commercial publisher. RSS snippet + link only."
    attribution: "Delfi"
    rewrite_allowed: false
    requires_human_approval: false
    research_role: prior_coverage
    research_language: en
    max_snippet_source: "rss_description_verbatim"
    enabled: false
    cache_ttl_minutes: 60
    notes: "Disabled until confirmed the channel returns English items rather than Lithuanian."

  - id: euobserver
    name: "EUobserver"
    publisher: "EUobserver"
    country: "EU"
    tier: C
    endpoint: "https://euobserver.com/feed/"
    verified: "2026-08-28 — HTTP 200, 20 items parsed by scripts/wire_check.py"
    auth: none
    licence: "Copyright. RSS snippet + link only."
    attribution: "EUobserver"
    rewrite_allowed: false
    requires_human_approval: false
    research_role: prior_coverage
    research_language: en
    max_snippet_source: "rss_description_verbatim"
    cache_ttl_minutes: 120

# ─────────────────────────────────────────────────────────────────────────
# Known-unavailable. Kept so future passes do not re-research them blindly.
# ─────────────────────────────────────────────────────────────────────────
unavailable:
  - id: statistics_estonia_news
    name: "Statistics Estonia news"
    reason: >-
      No English RSS exists. Both https://www.stat.ee/en/rss and
      https://www.stat.ee/rss?lang=en return 200 with Estonian content — the
      language selector is ignored by their RSS handler. Verified 2026-08-24;
      titles came back as "Töötuse määr oli teises kvartalis 6,6%".
    action: >-
      Do not re-add as a research source until an English feed exists. This is
      a licence question, not just an editorial one: handing Estonian source
      text to an English-writing model invites translation, which is a
      derivative work under DSM Art. 15 and is named explicitly in Google's
      scaled-content-abuse policy. The English-language guard in
      tests/test_sources.py enforces this.
  - id: lrt_en
    name: "LRT English (Lithuanian public broadcaster)"
    reason: "HTTP 502 at https://www.lrt.lt/en/news-in-english/rss/ on 2026-08-24; six other URL patterns 404 in research."
    action: "Retry periodically; contact lrt@lrt.lt for a syndication or feed endpoint."
  - id: bns
    name: "Baltic News Service"
    reason: "Paid B2B wire service, licensed to subscribers only. No public feed."
    action: "Do not ingest under any circumstance without a signed licence."
  - id: postimees_en
    name: "Postimees English"
    reason: "No standalone English edition or English RSS; main feed is Estonian."
    action: "None. Covered adequately by ERR News."
  - id: rebaltica
    name: "Re:Baltica"
    reason: "English RSS not located; investigative nonprofit worth a direct partnership approach."
    action: "Contact for syndication — mission-aligned, would strengthen credibility."
